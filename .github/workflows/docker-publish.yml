name: Build, Test and Publish Docker image & Deploy to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ... (Smoke Test and Setup Steps Omitted) ...
      
      # --- DOCKER HUB PUSH STEPS (Updated to use DOCKER_USERNAME/PASSWORD) ---
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          # Using your existing secrets
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/car_classifier:latest
            ${{ secrets.DOCKER_USERNAME }}/car_classifier:${{ github.sha }}

      # --- DEPLOYMENT STEP (No change needed here, as it uses SSH keys) ---
      - name: 🚀 Deploy to EKS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }} 
          username: ec2-user # Confirm your EC2 username
          key: ${{ secrets.EC2_SSH_KEY }}
          
          # The script runs on the EKS worker node to apply manifests
          script: |
            # 1. Download the latest deployment manifests from the GitHub repository
            # These files contain the image tag and secret names
            curl -o deployment.yaml https://raw.githubusercontent.com/${{ github.repository }}/main/deployment.yaml
            curl -o service.yaml https://raw.githubusercontent.com/${{ github.repository }}/main/service.yaml
            
            # 2. Apply the manifests using the local kubectl
            sudo kubectl apply -f deployment.yaml
            sudo kubectl apply -f service.yaml
            
            # 3. Wait for the new Pod to become Ready
            sudo kubectl rollout status deployment/gradio-gemini-deployment