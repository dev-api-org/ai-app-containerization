apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradio-gemini-deployment
  labels:
    app: gradio-gemini
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: gradio-gemini
  template:
    metadata:
      labels:
        app: gradio-gemini
    spec:
      # Instruct Kubernetes to use the Docker Hub credentials stored in the Secret
      imagePullSecrets: 
        - name: docker-pull-secret 
      containers:
      - name: gradio-gemini-app
        # This will be replaced by the workflow (or use the full secret:tag path)
        image: ${{ secrets.DOCKER_USERNAME }}/car_classifier:latest
        ports:
        - containerPort: 7860
        
        # Inject the Gemini API Key securely
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-secret 
              key: api-key
        
        # Allocate resources matching your m7i-flex.large node capacity
        resources:
          requests:
            cpu: "1500m"  # 1.5 vCPU
            memory: "4Gi" # 4 GiB of RAM
          limits:
            cpu: "2000m"  # 2 vCPU
            memory: "6Gi" # 6 GiB of RAM